openapi: 3.0.0
info:
  title: Календарь звонков API
  version: 0.0.0
tags:
  - name: Health
  - name: EventTypes
  - name: Slots
  - name: Bookings
paths:
  /api/bookings:
    get:
      operationId: listBookings
      description: Предстоящие встречи всех типов (конец позже текущего момента), по возрастанию начала.
      parameters: []
      responses:
        '200':
          description: The request has succeeded.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Booking'
        '500':
          description: Server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
      tags:
        - Bookings
    post:
      operationId: createBooking
      description: Записать гостя на слот. Конец встречи считает сервер.
      parameters: []
      responses:
        '201':
          description: The request has succeeded and a new resource has been created as a result.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Booking'
        '400':
          description: The server could not understand the request due to invalid syntax.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '404':
          description: The server cannot find the requested resource.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '409':
          description: The request conflicts with the current state of the server.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '500':
          description: Server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
      tags:
        - Bookings
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateBookingRequest'
  /api/event-types:
    get:
      operationId: listEventTypes
      parameters: []
      responses:
        '200':
          description: The request has succeeded.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/EventType'
        '500':
          description: Server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
      tags:
        - EventTypes
    post:
      operationId: createEventType
      parameters: []
      responses:
        '201':
          description: The request has succeeded and a new resource has been created as a result.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EventType'
        '400':
          description: The server could not understand the request due to invalid syntax.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '409':
          description: The request conflicts with the current state of the server.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '500':
          description: Server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
      tags:
        - EventTypes
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateEventTypeRequest'
  /api/event-types/{id}/slots:
    get:
      operationId: listSlots
      description: Свободные слоты типа встречи на окно записи (14 дней), по возрастанию старта.
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: The request has succeeded.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Slot'
        '404':
          description: The server cannot find the requested resource.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '500':
          description: Server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
      tags:
        - Slots
  /api/health:
    get:
      operationId: getHealth
      parameters: []
      responses:
        '200':
          description: The request has succeeded.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthStatus'
      tags:
        - Health
components:
  schemas:
    ApiError:
      type: object
      required:
        - code
        - message
      properties:
        code:
          type: string
        message:
          type: string
        fieldErrors:
          type: object
          additionalProperties:
            type: string
          description: 'Для ошибок данных: поле → сообщение.'
      description: Единый формат ошибки.
    Booking:
      type: object
      required:
        - id
        - eventType
        - start
        - end
        - guestName
        - guestEmail
        - guestTopic
      properties:
        id:
          type: string
        eventType:
          $ref: '#/components/schemas/EventTypeRef'
        start:
          type: string
          format: date-time
        end:
          type: string
          format: date-time
        guestName:
          type: string
        guestEmail:
          type: string
        guestTopic:
          type: string
          maxLength: 200
          description: Тема разговора от гостя; пустая строка — темы нет.
      description: 'Встреча: подтверждённая запись гостя на слот. Конец считает сервер.'
    CreateBookingRequest:
      type: object
      required:
        - eventTypeId
        - start
        - guestName
        - guestEmail
      properties:
        eventTypeId:
          type: string
        start:
          type: string
          format: date-time
          description: Начало слота (ISO 8601 со смещением), на сетке 30 минут в окне записи.
        guestName:
          type: string
        guestEmail:
          type: string
        guestTopic:
          type: string
          description: Необязательная тема разговора в одну строку, до 200 символов. Пробелы по краям обрезаются; пустая или из одних пробелов — темы нет.
      description: Данные для записи гостя на слот.
    CreateEventTypeRequest:
      type: object
      required:
        - id
        - title
        - durationMinutes
      properties:
        id:
          type: string
        title:
          type: string
        description:
          type: string
          description: 'Необязательно: если не указано, сохраняется пустое описание.'
        durationMinutes:
          type: integer
          format: int32
      description: Данные для создания типа встречи.
    EventType:
      type: object
      required:
        - id
        - title
        - description
        - durationMinutes
      properties:
        id:
          type: string
          description: 'Идентификатор: латиница в нижнем регистре, цифры, дефис.'
        title:
          type: string
        description:
          type: string
        durationMinutes:
          type: integer
          format: int32
          description: Длительность в минутах, кратна 30, от 30 до 480.
      description: 'Тип встречи: предложение владельца.'
    EventTypeRef:
      type: object
      required:
        - id
        - title
      properties:
        id:
          type: string
        title:
          type: string
      description: 'Ссылка на тип встречи внутри встречи: id и название.'
    HealthStatus:
      type: object
      required:
        - status
      properties:
        status:
          type: string
          enum:
            - ok
    Slot:
      type: object
      required:
        - start
        - end
      properties:
        start:
          type: string
          format: date-time
        end:
          type: string
          format: date-time
      description: 'Свободный слот: интервал времени в поясе владельца (+05:00).'
servers:
  - url: http://localhost:8080
    description: Локальный сервер разработки
    variables: {}
