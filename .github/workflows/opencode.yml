name: opencode

# Агент OpenCode отвечает на команды /oc и /opencode в комментариях к issue и PR.
# Описание (события, модель, права, где смотреть результат) — в README.md, раздел «Агент в GitHub».
# На один PR — не больше 4 запусков агента; считает их задание budget до вызова модели.

on:
  # Комментарий к issue или к PR целиком.
  # Триггер нужен по назначению; запуск ограничен доверенным автором и командой в условии if задания,
  # код PR не выполняется вне агента; права заданий перечислены ниже, у каждого только свои.
  # jactionlint ignore=dangerous-triggers
  issue_comment:
    types: [created]
  # Комментарий к строке diff в PR
  pull_request_review_comment:
    types: [created]

# По этому названию прогоны одного PR находятся в истории Actions и считается бюджет
run-name: "opencode #${{ github.event.issue.number || github.event.pull_request.number }}"

concurrency:
  # Один прогон на issue/PR: новая команда ждёт окончания предыдущей, а не отменяет её
  group: opencode-${{ github.event.issue.number || github.event.pull_request.number }}
  cancel-in-progress: false

permissions: {}

jobs:
  # Считает, сколько запусков агента уже было на этом PR, и решает, можно ли вызывать модель.
  # Состояние — история Actions: токен агента не может её переписать, текст комментариев на бюджет не влияет.
  budget:
    # То же условие, что у задания agent: считаем только допущенные команды.
    if: >-
      (contains(github.event.comment.body, '/oc') || contains(github.event.comment.body, '/opencode'))
      && contains(fromJSON('["OWNER","MEMBER","COLLABORATOR"]'), github.event.comment.author_association)
      && github.event.comment.user.type != 'Bot'
      && (github.event_name != 'pull_request_review_comment'
          || github.event.pull_request.head.repo.full_name == github.repository)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      actions: read
    outputs:
      used: ${{ steps.count.outputs.used }}
      allowed: ${{ steps.count.outputs.allowed }}
    steps:
      - name: Count agent runs for this PR
        id: count
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          EVENT_NAME: ${{ github.event_name }}
          ISSUE_PR_URL: ${{ github.event.issue.pull_request.url }}
          NUMBER: ${{ github.event.issue.number || github.event.pull_request.number }}
        run: |
          set -euo pipefail

          # Для обычных issues (не PR) предела нет
          is_pr="false"
          if [ "$EVENT_NAME" = "pull_request_review_comment" ] || [ -n "${ISSUE_PR_URL:-}" ]; then
            is_pr="true"
          fi
          if [ "$is_pr" != "true" ]; then
            printf 'used=0\n' >> "$GITHUB_OUTPUT"
            printf 'allowed=true\n' >> "$GITHUB_OUTPUT"
            exit 0
          fi

          # Прогоны этого воркфлоу с тем же display_title относятся к одному PR
          title="opencode #${NUMBER}"
          used=0
          runs=$(gh api "repos/$REPO/actions/workflows/opencode.yml/runs?per_page=100" --paginate \
            --jq ".workflow_runs[] | select(.display_title == \"$title\") | .id")
          for run_id in $runs; do
            jobs=$(gh api "repos/$REPO/actions/runs/$run_id/jobs?filter=all" --paginate \
              --jq '.jobs[] | select(.name == "agent") | [.status, (.conclusion // "")] | @tsv')
            while IFS=$'\t' read -r status conclusion; do
              [ -z "$status" ] && continue
              # Задание стартовало: conclusion не skipped и не null, либо ещё выполняется.
              # Отмена, тайм-аут и Re-run тоже расходуют попытку.
              if [ "$status" = "in_progress" ] || { [ "$conclusion" != "skipped" ] && [ "$conclusion" != "" ]; }; then
                used=$((used + 1))
              fi
            done <<< "$jobs"
          done

          allowed="false"
          if [ "$used" -lt 4 ]; then
            allowed="true"
          fi
          printf 'used=%s\n' "$used" >> "$GITHUB_OUTPUT"
          printf 'allowed=%s\n' "$allowed" >> "$GITHUB_OUTPUT"

  # Текущее задание OpenCode: вызывает модель, только если бюджет не исчерпан.
  agent:
    needs: budget
    if: needs.budget.outputs.allowed == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # Стандартная авторизация OpenCode: токен GitHub App через OIDC.
    # Комментарии и push агент делает правами приложения opencode-agent.
    # GITHUB_TOKEN с issues: write нужен только команде gh внутри агента:
    # скиллы to-spec, to-tickets и triage создают issues, ставят метки и связи.
    permissions:
      contents: read
      issues: write
      id-token: write
    steps:
      # Без ключа action падает невнятной ошибкой — проверяем заранее
      - name: Check model key
        env:
          OPENCODE_API_KEY: ${{ secrets.OPENCODE_API_KEY }}
        run: |
          if [ -z "${OPENCODE_API_KEY:-}" ]; then
            echo "::error::Секрет OPENCODE_API_KEY не задан (Settings → Secrets and variables → Actions). Без ключа модель не запустится."
            exit 1
          fi

      # actions/checkout v4, закреплено по SHA
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 1
          persist-credentials: false

      # OpenCode 1.19.6 из GitHub Releases с проверкой sha256. Раньше здесь был composite-action
      # anomalyco/opencode/github: его шаг «Get opencode version» спрашивает версию у GitHub API без
      # токена и падал на лимите анонимных запросов общего IP раннеров (а сбой съедал попытку бюджета).
      - name: Install OpenCode CLI
        env:
          OPENCODE_VERSION: 1.19.6
          OPENCODE_SHA256: 47734e08968b30cc22a0bffb6d9feeed76ad4aa743213a12122040392d09a057
        run: |
          set -euo pipefail
          mkdir -p "$HOME/.opencode/bin"
          curl -fsSL --retry 3 -o /tmp/opencode.tar.gz \
            "https://github.com/anomalyco/opencode/releases/download/v${OPENCODE_VERSION}/opencode-linux-x64.tar.gz"
          echo "${OPENCODE_SHA256}  /tmp/opencode.tar.gz" | sha256sum -c -
          tar -xzf /tmp/opencode.tar.gz -C "$HOME/.opencode/bin"
          echo "$HOME/.opencode/bin" >> "$GITHUB_PATH"

      # То же, что делал action: opencode github run (токен GitHub App через OIDC, ответ комментарием).
      # Скиллы берутся из .claude/skills/ (OpenCode читает этот каталог), правила — из AGENTS.md,
      # настройки трекера — из docs/agents/: всё это приходит вместе с checkout.
      - name: Run OpenCode
        run: opencode github run
        env:
          MODEL: opencode/claude-haiku-5-5
          # В CI некому ответить на запрос разрешения: «ask» вешает агента до тайм-аута (PR #21 —
          # external_directory после cd ..). Запросы, которые в CI некому подтвердить, — сразу отказ.
          OPENCODE_PERMISSION: '{"external_directory":"deny","doom_loop":"deny","question":"deny"}'
          MENTIONS: /oc,/opencode
          # Модель агента — платная OpenCode Zen claude-haiku-5-5, оплата по факту (ключ OPENCODE_API_KEY);
          # служебная модель для заголовков сессий — Gemini Flash Lite (opencode.json)
          OPENCODE_API_KEY: ${{ secrets.OPENCODE_API_KEY }}
          GOOGLE_GENERATIVE_AI_API_KEY: ${{ secrets.GOOGLE_GENERATIVE_AI_API_KEY }}
          # Без него gh в шагах агента не авторизован
          GH_TOKEN: ${{ github.token }}

  # Если модель не вызывалась из-за бюджета или задание агента не завершилось успехом,
  # зовём человека: причина, последний head SHA PR и ссылка на прогон.
  report:
    needs: [budget, agent]
    if: >-
      always()
      && needs.budget.result == 'success'
      && (needs.budget.outputs.allowed != 'true' || needs.agent.result != 'success')
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      actions: read
      issues: write
      pull-requests: write
    steps:
      - name: Report that a human is needed
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          EVENT_NAME: ${{ github.event_name }}
          ISSUE_PR_URL: ${{ github.event.issue.pull_request.url }}
          NUMBER: ${{ github.event.issue.number || github.event.pull_request.number }}
          RUN_ID: ${{ github.run_id }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          ALLOWED: ${{ needs.budget.outputs.allowed }}
          USED: ${{ needs.budget.outputs.used }}
        run: |
          set -euo pipefail

          is_pr="false"
          if [ "$EVENT_NAME" = "pull_request_review_comment" ] || [ -n "${ISSUE_PR_URL:-}" ]; then
            is_pr="true"
          fi

          head_sha=""
          if [ "$is_pr" = "true" ]; then
            head_sha=$(gh pr view "$NUMBER" --repo "$REPO" --json headRefOid --jq .headRefOid || true)
          fi

          reason=""
          detail=""
          log_url="$RUN_URL"
          if [ "$ALLOWED" != "true" ]; then
            # Модель не вызывалась: бюджет исчерпан
            reason="limit_exhausted"
            detail="Бюджет запусков агента на этот PR исчерпан (${USED}/4), модель не вызывалась."
          else
            # Задание agent текущего прогона (включая предыдущие попытки этого же прогона)
            job_id=$(gh api "repos/$REPO/actions/runs/$RUN_ID/jobs?filter=all" \
              --jq '.jobs[] | select(.name == "agent") | .id' | head -n1 || true)
            log=""
            if [ -n "$job_id" ]; then
              # Лог завершённого задания GitHub выкладывает не сразу: несколько попыток.
              # curl, а не gh api: gh отказывается выводить лог с управляющими последовательностями
              # терминала (цвета вывода OpenCode), и лог оказывался пустым.
              for _ in 1 2 3 4 5 6; do
                log=$(curl -sSL -H "Authorization: Bearer ${GH_TOKEN}" \
                  "${GITHUB_API_URL}/repos/$REPO/actions/jobs/$job_id/logs" 2>/dev/null || true)
                [ -n "$log" ] && break
                sleep 10
              done
              log_url="$RUN_URL/job/$job_id"
            fi
            if [ -z "$log" ]; then
              # Без лога причину не угадываем
              reason="agent_failed"
              detail="Лог задания агента недоступен, причину смотрите по ссылке."
            elif grep -q "has exceeded the maximum execution time" <<< "$log"; then
              reason="timeout"
              detail="Задание агента превысило максимальное время выполнения."
            elif grep -qE "high demand|Service Unavailable|Free usage limit|RESOURCE_EXHAUSTED|statusCode: (429|503)" <<< "$log"; then
              # Сессия стартовала, но провайдер модели отказал: перегрузка или лимит
              reason="infra"
              detail="Провайдер модели отказал (перегрузка или лимит запросов)."
            elif ! grep -q "opencode session" <<< "$log"; then
              # Сессия агента не стартовала: сбой подготовки или нет ключа
              reason="infra"
              detail="Сбой подготовки или не задан ключ модели: сессия агента не стартовала."
            else
              # Неопределённую причину не угадываем — даём ссылку на лог
              reason="agent_failed"
              detail="Прочая ошибка агента, точную причину смотрите в логе задания."
            fi
          fi

          comment_file="${RUNNER_TEMP:-/tmp}/opencode-comment.md"
          {
            printf '### Нужен человек: запуск агента\n\n'
            printf "**Причина:** \`%s\`. %s\n\n" "$reason" "$detail"
            if [ -n "$head_sha" ]; then
              printf "**Head SHA PR:** \`%s\`\n\n" "$head_sha"
            fi
            printf '**Прогон:** %s\n' "$RUN_URL"
            if [ "$reason" != "limit_exhausted" ] && [ "$log_url" != "$RUN_URL" ]; then
              printf '**Лог задания:** %s\n' "$log_url"
            fi
          } > "$comment_file"
          gh issue comment "$NUMBER" --repo "$REPO" --body-file "$comment_file"
