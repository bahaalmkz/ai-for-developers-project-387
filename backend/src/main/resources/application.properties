spring.application.name=calendar

# Встроенная БД H2 в файле: данные переживают перезапуск
spring.datasource.url=jdbc:h2:file:./data/calendar
spring.datasource.username=sa
spring.datasource.password=
spring.sql.init.mode=always
spring.sql.init.schema-locations=classpath:schema.sql

# Расписание (ADR 0003): один пояс владельца, часы работы, шаг стартов, окно записи в днях
calendar.schedule.zone=Asia/Almaty
calendar.schedule.work-start=09:00
calendar.schedule.work-end=18:00
calendar.schedule.step=30m
calendar.schedule.window-days=14

# Порт из переменной окружения PORT (Render и проверка Хекслета), локально 8080
server.port=${PORT:8080}
# Статику раздаёт web/SpaConfig (с переходом на index.html для маршрутов фронтенда)
spring.web.resources.add-mappings=false
