name: opencode-review

# Агент OpenCode независимо ревьюит каждый pull request по критериям REVIEW.md.
# Описание (событие, права, тайм-аут, отмена устаревших запусков) — в README.md,
# раздел «Агент в GitHub». Ревьюер только читает код и .review/, комментарий публикует gh без модели.

on:
  # Новая версия PR, повторное открытие и снятие черновика запускают ревью заново.
  # pull_request_target не используется: код PR не получает ключ модели и права записи.
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]

concurrency:
  # Новая версия PR отменяет устаревшее ревью: проверять имеет смысл только последний head SHA.
  group: opencode-review-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions: {}

jobs:
  review:
    # Ревьюим только PR из этого репозитория и не черновики. Фильтра по автору-боту нет:
    # PR агента тоже проходит ревью. PR из fork пропускаются, потому что их код не должен
    # получать ключ модели.
    if: >-
      github.event.pull_request.head.repo.full_name == github.repository
      && github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # Модель только читает файлы. Права нужны сбору контекста и публикации комментария:
    # contents — checkout кода PR и REVIEW.md, issues — тексты связанных issues,
    # actions/checks/statuses — статусы CI, pull-requests — комментарий с ревью.
    # id-token не нужен: GitHub App и OIDC здесь не используются.
    permissions:
      contents: read
      issues: read
      actions: read
      checks: read
      statuses: read
      pull-requests: write
    steps:
      # actions/checkout v4, закреплено по SHA. Проверяем именно head SHA PR, а не merge-коммит.
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 1
          persist-credentials: false

      # Контекст собирается без модели: заголовок и тело PR, diff, связанные issues,
      # статусы CI и копия критериев. Модель читает эти файлы вместе с кодом на head SHA.
      - name: Gather review context
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          set -euo pipefail
          mkdir -p .review
          gh pr view "$PR_NUMBER" --json number,title,body,headRefOid,baseRefName > .review/pr.json
          gh pr diff "$PR_NUMBER" > .review/pr.diff
          gh pr checks "$PR_NUMBER" > .review/checks.txt 2>&1 || true
          cp REVIEW.md .review/REVIEW.md

          # Номера issues из тела PR (#N), без повторов. Ссылки на PR и недоступные
          # номера не роняют шаг: для них просто останется пометка в issues.md.
          jq -r '.body // ""' .review/pr.json \
            | grep -oE '#[0-9]+' \
            | tr -d '#' \
            | sort -un > .review/issue-numbers.txt || true
          : > .review/issues.md
          while read -r n; do
            [ -z "$n" ] && continue
            {
              echo "## Issue #$n"
              echo
              gh issue view "$n" --comments || echo "Не удалось прочитать issue #$n"
              echo
            } >> .review/issues.md
          done < .review/issue-numbers.txt

      # Установка CLI закреплённой версии: бинарник из GitHub Releases с проверкой sha256
      # (не скрипт curl | bash). Каталог бинарника добавляется в PATH для следующего шага.
      - name: Install OpenCode CLI
        env:
          OPENCODE_VERSION: 1.19.6
          OPENCODE_SHA256: 47734e08968b30cc22a0bffb6d9feeed76ad4aa743213a12122040392d09a057
        run: |
          set -euo pipefail
          mkdir -p "$HOME/.opencode/bin"
          curl -fsSL -o /tmp/opencode.tar.gz \
            "https://github.com/anomalyco/opencode/releases/download/v${OPENCODE_VERSION}/opencode-linux-x64.tar.gz"
          echo "${OPENCODE_SHA256}  /tmp/opencode.tar.gz" | sha256sum -c -
          tar -xzf /tmp/opencode.tar.gz -C "$HOME/.opencode/bin"
          echo "$HOME/.opencode/bin" >> "$GITHUB_PATH"

      # Ревью обычным CLI за один шаг: весь контекст собран в один файл и передан через stdin
      # (CLI добавляет его к тексту запроса), все инструменты модели запрещены. Модель только
      # отвечает текстом: не читает другие файлы, не меняет код, не запускает команды.
      # Бесплатная модель тратит 30–60 с на шаг — с чтением файлов ревью не укладывалось
      # в тайм-аут (PR #18), а question/plan_exit в неинтерактивном прогоне ждали бы ответа.
      - name: Review pull request
        env:
          OPENCODE_API_KEY: ${{ secrets.OPENCODE_API_KEY }}
          OPENCODE_PERMISSION: >-
            {"read":"deny","glob":"deny","grep":"deny","list":"deny","edit":"deny",
            "bash":"deny","webfetch":"deny","websearch":"deny","codesearch":"deny",
            "task":"deny","todowrite":"deny","skill":"deny","question":"deny","plan_exit":"deny"}
        run: |
          set -euo pipefail
          # Один файл контекста: критерии, PR, связанные issues, статусы CI, diff
          {
            echo "# REVIEW.md — критерии ревью"; echo; cat .review/REVIEW.md; echo
            echo "# PR (заголовок, тело, head SHA)"; echo; jq -r '"\(.title)\n\nhead SHA: \(.headRefOid)\n\n\(.body // "")"' .review/pr.json; echo
            echo "# Связанные issues (спецификация, тикеты, согласование)"; echo; cat .review/issues.md; echo
            echo "# Статусы CI"; echo; cat .review/checks.txt; echo
            echo "# Diff PR"; echo; echo '```diff'; cat .review/pr.diff; echo '```'
          } > .review/context.md

          cat > .review/prompt.md <<'PROMPT'
          Ты — независимый ревьюер pull request. Весь контекст — ниже в этом сообщении:
          критерии REVIEW.md, описание PR, связанные issues, статусы CI и diff. Инструменты
          недоступны: отвечай сразу, одним сообщением, только по этому контексту.

          Что проверить:
          1. Дефекты относительно REVIEW.md: занятость слотов и 409, время и окно записи, контракт API, формат ошибок, совместимость данных H2, тесты, объём относительно спецификации и тикетов, шаблон PR и Conventional Commits.
          2. Соответствие diff спецификации и тикетам из связанных issues; если спецификация или согласование недоступны, отметь это.
          3. Учти статусы CI, но не повторяй вывод линтера.

          Формат ответа — только текст ревью, без вступлений и служебных фраз:
          - для каждого подтверждённого дефекта: файл и строка, условие ошибки, последствие;
          - если подтверждённых дефектов нет, так и напиши;
          - если объём выходит за согласованную спецификацию или согласование недоступно — отметь отдельно.

          Не публикуй комментарии: это сделает отдельный шаг.
          PROMPT

          set +e
          timeout 720 opencode run \
            --agent plan \
            --model opencode/deepseek-v4.1-flash-free \
            --format json \
            "$(cat .review/prompt.md)" < .review/context.md > .review/review.jsonl 2> .review/review.err
          status=$?
          set -e
          echo "REVIEW_STATUS=$status" >> "$GITHUB_ENV"

          # Диагностика в лог прогона: какие события и инструменты были и что в stderr
          echo "::group::opencode events (type, tool)"
          jq -r '[.type, (.part.tool // "")] | @tsv' .review/review.jsonl 2>/dev/null | tail -n 40 || true
          echo "::endgroup::"
          echo "::group::opencode stderr (tail)"
          tail -c 4000 .review/review.err || true
          echo "::endgroup::"

          # Текст ревью — последнее событие type == "text" в JSON-потоке CLI.
          jq -s -r '[.[] | select(.type == "text")] | last | .part.text? // empty' \
            .review/review.jsonl > .review/review.md 2>/dev/null || true

          if [ "$status" -ne 0 ]; then
            echo "Модель завершилась с кодом $status" >&2
            exit "$status"
          fi

      # Публикация без модели: тот же gh, что собирал контекст. Если модель упала
      # или не вернула текст, вместо ревью будет короткая причина и ссылка на лог.
      # Отменённое устаревшее ревью (новая версия PR) ничего не публикует.
      - name: Publish review comment
        if: ${{ !cancelled() }}
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -euo pipefail
          mkdir -p .review
          {
            echo "## Авторевью для \`${HEAD_SHA}\`"
            echo
            if [ "${REVIEW_STATUS:-1}" = "0" ] && [ -s .review/review.md ]; then
              cat .review/review.md
            else
              echo "Ревью не получено (код ${REVIEW_STATUS:-unknown}). Лог: ${RUN_URL}"
            fi
          } > .review/comment.md
          gh pr comment "$PR_NUMBER" --body-file .review/comment.md
